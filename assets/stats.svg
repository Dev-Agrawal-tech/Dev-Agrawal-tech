<svg width="480" height="260" viewBox="0 0 480 260" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#0d0618"/><stop offset="100%" stop-color="#241246"/>
</linearGradient>
<linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#ff4fd8"/><stop offset="100%" stop-color="#9b5cff"/>
</linearGradient>
<linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" stop-color="#ff4fd8"/><stop offset="100%" stop-color="#9b5cff"/>
</linearGradient>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<clipPath id="cardClip"><rect x="0" y="0" width="480" height="260" rx="18"/></clipPath>
</defs>
<g clip-path="url(#cardClip)">
<rect x="0" y="0" width="480" height="260" fill="url(#bg)"/>
<rect x="0.5" y="0.5" width="479" height="259" rx="18" fill="none" stroke="#5b2a86" stroke-width="1.5"/>
<text x="24" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f3e8ff">Dev's GitHub Stats</text>

<g filter="url(#glow)">
<circle cx="96" cy="130" r="62" fill="none" stroke="#5b2a86" stroke-width="12" opacity="0.4"/>
<circle cx="96" cy="130" r="62" fill="none" stroke="url(#ringGrad)" stroke-width="12" stroke-linecap="round"
 stroke-dasharray="389.6" stroke-dashoffset="389.6" transform="rotate(-90 96 130)">
<animate attributeName="stroke-dashoffset" from="389.6" to="54.5" dur="1.8s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1"/>
</circle>
</g>
<text x="96" y="126" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#f3e8ff" opacity="0">
<animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.6s" fill="freeze"/>A+</text>
<text x="96" y="150" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#b79ee0" opacity="0">
<animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.8s" fill="freeze"/>RANK</text>

<g><g opacity="0">
<animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.4s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" values="40 0;0 0" dur="0.5s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
<circle cx="210" cy="39" r="4" fill="url(#barGrad)"/>
<text x="224" y="44" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#b79ee0">Total Stars</text>
<text x="456" y="44" text-anchor="end" font-family="Consolas, Monaco, monospace" font-size="15" font-weight="700" fill="#f3e8ff">62</text>
</g><g opacity="0">
<animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.55s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" values="40 0;0 0" dur="0.5s" begin="0.55s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
<circle cx="210" cy="77" r="4" fill="url(#barGrad)"/>
<text x="224" y="82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#b79ee0">Total Commits</text>
<text x="456" y="82" text-anchor="end" font-family="Consolas, Monaco, monospace" font-size="15" font-weight="700" fill="#f3e8ff">940</text>
</g><g opacity="0">
<animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.7s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" values="40 0;0 0" dur="0.5s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
<circle cx="210" cy="115" r="4" fill="url(#barGrad)"/>
<text x="224" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#b79ee0">Total PRs</text>
<text x="456" y="120" text-anchor="end" font-family="Consolas, Monaco, monospace" font-size="15" font-weight="700" fill="#f3e8ff">51</text>
</g><g opacity="0">
<animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.85s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" values="40 0;0 0" dur="0.5s" begin="0.85s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
<circle cx="210" cy="153" r="4" fill="url(#barGrad)"/>
<text x="224" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#b79ee0">Total Issues</text>
<text x="456" y="158" text-anchor="end" font-family="Consolas, Monaco, monospace" font-size="15" font-weight="700" fill="#f3e8ff">23</text>
</g><g opacity="0">
<animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.0s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" values="40 0;0 0" dur="0.5s" begin="1.0s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
<circle cx="210" cy="191" r="4" fill="url(#barGrad)"/>
<text x="224" y="196" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#b79ee0">Repositories</text>
<text x="456" y="196" text-anchor="end" font-family="Consolas, Monaco, monospace" font-size="15" font-weight="700" fill="#f3e8ff">29</text>
</g></g>
</g>
</svg>